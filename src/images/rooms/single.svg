<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="シングルルームのイメージ">
  <defs>
    <linearGradient id="s-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f8fb"/>
      <stop offset="100%" stop-color="#e4ebf3"/>
    </linearGradient>
    <linearGradient id="s-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9cdea"/>
      <stop offset="100%" stop-color="#e8f2fa"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#s-wall)"/>
  <rect y="270" width="600" height="130" fill="#d5dee9"/>
  <rect y="266" width="600" height="6" fill="#c3ccd8"/>
  <ellipse cx="300" cy="332" rx="190" ry="30" fill="#c3ccd8" opacity="0.55"/>

  <!-- 窓 -->
  <rect x="400" y="62" width="150" height="140" rx="4" fill="url(#s-sky)"/>
  <circle cx="522" cy="96" r="15" fill="#f7dfa5"/>
  <path d="M400 175 L440 145 L470 168 L505 138 L550 172 L550 202 L400 202 Z" fill="#bcd3e6"/>
  <rect x="400" y="62" width="150" height="140" rx="4" fill="none" stroke="#c3ccd8" stroke-width="8"/>
  <line x1="475" y1="62" x2="475" y2="202" stroke="#c3ccd8" stroke-width="6"/>

  <!-- ベッド（シングル：枕1つ） -->
  <rect x="90" y="120" width="170" height="70" rx="8" fill="#c8d3e0"/>
  <rect x="80" y="185" width="190" height="50" rx="8" fill="#ffffff" stroke="#dde4ec" stroke-width="3"/>
  <rect x="80" y="212" width="190" height="23" rx="6" fill="#1a6fb5" opacity="0.8"/>
  <rect x="110" y="163" width="70" height="28" rx="10" fill="#ffffff" stroke="#dde4ec" stroke-width="3"/>
  <rect x="90" y="235" width="12" height="22" rx="3" fill="#b0bccb"/>
  <rect x="248" y="235" width="12" height="22" rx="3" fill="#b0bccb"/>

  <!-- サイドテーブルとランプ -->
  <rect x="285" y="203" width="58" height="11" rx="3" fill="#c8d3e0"/>
  <rect x="309" y="214" width="9" height="52" rx="2" fill="#b0bccb"/>
  <rect x="311" y="176" width="5" height="28" rx="2" fill="#b0bccb"/>
  <path d="M298 176 L330 176 L323 152 L305 152 Z" fill="#f2c76b"/>
</svg>
