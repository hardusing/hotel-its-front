<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    <head> の文言も辞書へ移してある。data-i18n は textContent を、
    data-i18n-attr は "属性名:キー" の形で属性を差し替える（lang.js を参照）。
    ここに書いてある日本語は初期値で、JS が読み込まれる前や落ちた場合に
    空のタイトル・空の説明を出さないために残している。
  -->
  <title data-i18n="meta.title">Hotel ITS｜空に一番近い、やすらぎのひととき</title>
  <meta name="description" data-i18n-attr="content:meta.description" content="都会の真ん中で過ごす、上質な滞在体験。シングル・ダブル・スイートの3タイプから、空室と料金をカレンダーで確かめてそのままご予約いただけます。" />

  <!--
    SNS やメッセージアプリに URL を貼ったときのカード表示。
    og:image は絶対 URL でなければ読まれないので、公開ドメインが決まったら
    https://example.com の部分を差し替えること（相対パスでは表示されない）。
  -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Hotel ITS" />
  <meta property="og:title" data-i18n-attr="content:meta.ogTitle" content="Hotel ITS｜空に一番近い、やすらぎのひととき" />
  <meta property="og:description" data-i18n-attr="content:meta.ogDescription" content="都会の真ん中で過ごす、上質な滞在体験。空室と料金をカレンダーで確かめて、そのままご予約いただけます。" />
  <meta property="og:url" content="https://example.com/" />
  <meta property="og:image" content="https://example.com/images/ogp.jpg" />
  <!--
    og:locale は言語コードではなく "ja_JP" の形で書く決まり。
    値の更新は lang.js の applyDocumentLanguage が行う（data-i18n-attr は
    使わない。翻訳対象を持たない LP でも同じ更新が要るため、仕組みを
    文書属性側に一本化している）。
    SNS のクローラは JS を実行しないので、ここが実際に効くのは
    サーバー側で言語ごとの HTML を返すようになってから。
  -->
  <meta property="og:locale" content="ja_JP" />


  <!--
    言語ごとの URL を検索エンジンに伝える。
    同じ内容を複数の言語で出すページは、これが無いと重複コンテンツとみなされ、
    どちらか一方しか検索結果に載らないことがある。
    x-default は「どの言語指定にも当てはまらない人向け」＝ 指定なしの URL。

    href は絶対 URL でなければ読まれない。公開ドメインが決まったら
    https://example.com の部分を差し替えること（og:url と同じ場所）。

    なお表示言語は JS が決めるため、いまはどの URL を開いても返る HTML は
    同じもの（日本語）で、切り替わるのはブラウザ上だけ。クローラは JS を
    実行しないので、ここが本当に効くのはサーバー側で言語ごとの HTML を
    返すようになってから。
  -->
  <link rel="alternate" hreflang="ja" href="https://example.com/?lang=ja" />
  <link rel="alternate" hreflang="en" href="https://example.com/?lang=en" />
  <link rel="alternate" hreflang="zh-Hans" href="https://example.com/?lang=zh" />
  <link rel="alternate" hreflang="x-default" href="https://example.com/" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" data-i18n-attr="content:meta.ogTitle" content="Hotel ITS｜空に一番近い、やすらぎのひととき" />
  <meta name="twitter:description" data-i18n-attr="content:meta.ogDescription" content="都会の真ん中で過ごす、上質な滞在体験。空室と料金をカレンダーで確かめて、そのままご予約いただけます。" />
  <meta name="twitter:image" content="https://example.com/images/ogp.jpg" />
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="#" class="header__logo">Hotel ITS</a>
      <nav class="nav">
        <ul class="nav__list">
          <li><a href="#hero" class="nav__link" data-i18n="nav.home">ホーム</a></li>
          <li><a href="#rooms" class="nav__link" data-i18n="nav.rooms">客室</a></li>
          <li><a href="#access" class="nav__link" data-i18n="nav.access">アクセス</a></li>
          <li><a href="#reserve" class="nav__link nav__link--cta" data-i18n="nav.reserve">予約</a></li>
        </ul>
      </nav>
      <div class="lang-switch" role="group" data-i18n-attr="aria-label:common.langSwitch" aria-label="Language">
        <button type="button" class="lang-switch__btn" data-lang="ja">JP</button>
        <button type="button" class="lang-switch__btn" data-lang="en">EN</button>
        <button type="button" class="lang-switch__btn" data-lang="zh">CN</button>
      </div>
    </div>
  </header>

  <main>
    <section id="hero" class="hero">
      <div class="container hero__inner">
        <h1 class="hero__title" data-i18n="hero.title">空に一番近い、やすらぎのひととき</h1>
        <p class="hero__subtitle" data-i18n="hero.subtitle">都会の真ん中で過ごす、上質な滞在体験を。</p>
        <a href="#reserve" class="btn btn--primary hero__cta" data-i18n="hero.cta">今すぐ予約する</a>
      </div>
    </section>

    <section id="rooms" class="rooms">
      <div class="container">
        <h2 class="section__title" data-i18n="rooms.title">客室紹介</h2>
        <p class="section__lead" data-i18n="rooms.lead">用途に合わせてお選びいただける、3つの客室タイプ。</p>

        <!--
          在庫を最後に取得できた時刻。JS（lastUpdated.js）が出し入れする。
          在庫は数十秒遅れの値なので、いつ時点のものかを添えないと
          画面の数字がどれくらい信用できるのか利用者に判断できない。
        -->
        <p class="rooms__updated" id="rooms-updated" role="status" hidden></p>

        <div class="rooms__grid" id="rooms-grid">
          <!-- 客室カードは JS が API から取得して描画する -->
        </div>
      </div>
    </section>

    <section id="access" class="access">
      <div class="container">
        <h2 class="section__title" data-i18n="access.title">アクセス</h2>
        <dl class="access__list">
          <div class="access__item">
            <dt class="access__term" data-i18n="access.address.term">住所</dt>
            <dd class="access__desc" data-i18n="access.address.desc">東空市スカイライン区タワー通り1-2-3</dd>
          </div>
          <div class="access__item">
            <dt class="access__term" data-i18n="access.station.term">最寄り駅</dt>
            <dd class="access__desc" data-i18n="access.station.desc">クラウド駅から徒歩5分</dd>
          </div>
          <div class="access__item">
            <dt class="access__term" data-i18n="access.hours.term">営業情報</dt>
            <dd class="access__desc" data-i18n="access.hours.desc">チェックイン 15:00 ／ チェックアウト 11:00</dd>
          </div>
        </dl>
      </div>
    </section>

    <section id="reserve" class="reserve">
      <div class="container reserve__inner">
        <h2 class="reserve__title" data-i18n="reserve.title">ご予約はこちらから</h2>
        <p class="reserve__text" data-i18n="reserve.text">特別な一日を、Hotel ITS で。</p>
        <a href="#reserve" class="btn btn--primary" data-i18n="reserve.cta">予約する</a>
      </div>
    </section>
  </main>

  <!--
    客室詳細モーダルはここには書かない。トップページとキャンペーン LP の両方で
    同じものを使うため、マークアップは src/modal/roomModalTemplate.js に一本化し、
    initRoomModal() が body へ差し込む（HTML を 2 ファイルに複製しないため）。
  -->

  <footer class="footer">
    <div class="container">
      <p class="footer__copy" data-i18n="footer.copy">&copy; 2026 Hotel ITS. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
